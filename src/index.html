<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#222">
  <!-- OGP -->
  <meta property="og:title" content="{APP_TITLE}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{APP_URL}">
  <meta property="og:image" content="{APP_URL}/pwa/icon.webp">
  <meta property="og:site_name" content="{APP_TITLE}">
  <meta property="og:description" content="{APP_DESCRIPTION}">
  <meta property="og:locale" content="ja">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="{APP_PROVIDER_TWITTER}">
  <meta name="twitter:creator" content="{APP_PROVIDER_TWITTER}">

  <!-- フォント -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com">
  <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com">
  <link rel="stylesheet" crossorigin="anonymous"
    href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+JP:wght@100..900&display=swap"
    rel="stylesheet">
  <!-- TITLE -->
  <title>{APP_TITLE} - {APP_VERSION}</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/main.ts"></script>
</body>

</html>
